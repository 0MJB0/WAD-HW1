<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostIt - Add Post</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <nav>
            <a href="index.html">Home</a>
            <a href="addPost.html">Add Post</a>
        </nav>
        <a href="login.html" class="user-icon"><img src="images/avatar.svg" alt="User profile"></a>
    </header>

    <main class="center">
        <form class="card" action="index.html" method="get">
            <div class="form-row">
                <label for="body">Post body</label>
                <textarea id="body" name="body" placeholder="textarea" rows="5"></textarea>
            </div>
            <div class="form-row">
                <label for="file">Select file</label>
                <input type="file" id="file" name="file">
            </div>
            <button type="submit" class="btn">Create post</button>
        </form>
    </main>
</body>
</html>
